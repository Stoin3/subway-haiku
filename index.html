<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Havenstad</title>
  <meta name="description" content="Havenstad: een open-wereld 3D-stad in je browser. Missies, auto's, helikopters, overvallen, sloop, bouwen en een relatie met Mika.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23101820'/%3E%3Cpath d='M3 13V6l3-2v9M7 13V3l4 2v8M12 13V8l2 1v4' fill='%23ffd54f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/ow.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="loading"><div class="ld-inner"><h1>HAVEN<span>STAD</span></h1><p id="ld-text">De stad wordt gebouwd…</p><div class="ld-bar"><i></i></div></div></div>
  <div id="fatal" class="hidden"></div>

  <script type="module">
    // Three.js en addons laden, daarna de spelmodules (gewone scripts) op volgorde.
    var fatal = document.getElementById('fatal');
    function fail(msg) { fatal.textContent = msg; fatal.classList.remove('hidden'); }
    try {
      const THREE = await import('three');
      const [ec, rp, ub, op, bgu, rf] = await Promise.all([
        import('three/addons/postprocessing/EffectComposer.js'),
        import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/UnrealBloomPass.js'),
        import('three/addons/postprocessing/OutputPass.js'),
        import('three/addons/utils/BufferGeometryUtils.js'),
        import('three/addons/objects/Reflector.js')
      ]);
      window.THREE = THREE;
      window.THREE_ADDONS = {
        EffectComposer: ec.EffectComposer, RenderPass: rp.RenderPass, UnrealBloomPass: ub.UnrealBloomPass,
        OutputPass: op.OutputPass, BufferGeometryUtils: bgu, Reflector: rf.Reflector
      };
    } catch (err) {
      fail('Kon de 3D-bibliotheek niet laden. Controleer je internetverbinding en ververs de pagina.');
      throw err;
    }
    const files = ['core', 'audio', 'env', 'city', 'fx', 'characters', 'vehicles', 'actors', 'weapons', 'npc', 'girlfriend', 'construction', 'missions', 'ui', 'main'];
    const txt = document.getElementById('ld-text');
    for (const f of files) {
      txt.textContent = 'Laden: ' + f + '…';
      await new Promise(function (res, rej) {
        const s = document.createElement('script');
        s.src = 'js/ow/' + f + '.js';
        s.onload = res;
        s.onerror = function () { rej(new Error('Kon ' + f + '.js niet laden')); };
        document.body.appendChild(s);
      });
    }
    txt.textContent = 'De stad wordt gebouwd…';
    // even wachten zodat het laadscherm getekend wordt
    await new Promise(function (r) { requestAnimationFrame(function () { setTimeout(r, 30); }); });
    try { window.G.boot(); } catch (err) { fail('Er ging iets mis bij het starten: ' + err.message); throw err; }
  </script>
</body>
</html>
